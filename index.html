<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スクール管理 🎀</title>

<style>
body{
font-family:-apple-system;
background:linear-gradient(#ffe3f0,#e3f0ff);
margin:0;
padding:10px;
text-align:center;
}

.container{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
max-width:420px;
margin:auto;
}

.box{
background:white;
border-radius:20px;
padding:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.full{grid-column:span 2;}

canvas{
width:100%;
height:200px;
}

input{
margin:3px;
padding:5px;
border-radius:10px;
border:1px solid #ccc;
}

button{
border:none;
background:#ff9ecb;
color:white;
border-radius:10px;
padding:5px 10px;
margin:3px;
}

.todo-item{
display:flex;
justify-content:space-between;
align-items:center;
margin:5px 0;
font-size:14px;
}

.warn{color:red;font-size:12px;}
</style>
</head>

<body>

<h2>スクール管理 🎀</h2>

<div class="container">

<!-- 時計 -->
<div class="box">
<canvas id="clockChart"></canvas>

<div style="font-size:12px;">
🌙 <input type="time" id="sleepStart" value="22:00">
〜
<input type="time" id="sleepEnd" value="07:00"><br>

🏫 <input type="time" id="schoolStart" value="08:30">
〜
<input type="time" id="schoolEnd" value="15:30"><br>

<button onclick="updateClock()">更新</button>
</div>

<div id="warn" class="warn"></div>
</div>

<!-- ToDo -->
<div class="box">
<h3>ToDo</h3>
<div id="todoList"></div>
<input id="todoInput" placeholder="やること">
<button onclick="addTodo()">追加</button>
</div>

<!-- 持ち物 -->
<div class="box full">
<h3>持ち物</h3>
<div id="itemList"></div>
<input id="itemInput" placeholder="持ち物">
<button onclick="addItem()">追加</button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// ===== 時計目盛りプラグイン =====
const clockTicks = {
id: 'clockTicks',
afterDraw(chart) {
const {ctx} = chart;
const cx = chart.width / 2;
const cy = chart.height / 2;
const r = chart._metasets[0].data[0].outerRadius + 10;

ctx.save();
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.font = "10px sans-serif";

for(let i=0;i<24;i++){
let angle = (i/24)*2*Math.PI - Math.PI/2;

let x = cx + Math.cos(angle)*r;
let y = cy + Math.sin(angle)*r;

ctx.fillText(i, x, y);

let x1 = cx + Math.cos(angle)*(r-8);
let y1 = cy + Math.sin(angle)*(r-8);

ctx.beginPath();
ctx.moveTo(x1,y1);
ctx.lineTo(x,y);
ctx.strokeStyle="#aaa";
ctx.stroke();
}
ctx.restore();
}
};

// ===== 時間処理 =====
function t2m(t){
let [h,m]=t.split(":");
return h*60 + +m;
}

function span(s,e){
if(e<s) e+=1440;
return e-s;
}

function overlap(a,b,c,d){
if(b<a)b+=1440;
if(d<c)d+=1440;
return Math.max(a,c) < Math.min(b,d);
}

// ===== 時計 =====
let chart;

function updateClock(){

let s1=t2m(sleepStart.value);
let s2=t2m(sleepEnd.value);
let sc1=t2m(schoolStart.value);
let sc2=t2m(schoolEnd.value);

let sleep=span(s1,s2);
let school=span(sc1,sc2);
let free=1440 - sleep - school;

let over=overlap(s1,s2,sc1,sc2);

warn.innerText = over ? "⚠️ 時間かぶってる！" : "";

if(chart) chart.destroy();

chart = new Chart(clockChart,{
type:"doughnut",
data:{
datasets:[{
data:[sleep,school,free],
backgroundColor:[
over ? "#ff6b6b" : "#caffbf",
"#a0c4ff",
"#ffd6a5"
]
}]
},
options:{
rotation:-90,
circumference:360,
plugins:{legend:{display:false}}
},
plugins:[clockTicks]
});
}

// ===== ToDo =====
let todo = JSON.parse(localStorage.getItem("todo")||"[]");

function renderTodo(){
todoList.innerHTML = todo.map((t,i)=>`
<div class="todo-item">
<label>
<input type="checkbox" ${t.done?"checked":""} onclick="toggleTodo(${i})">
${t.text}
</label>
<div>
<button onclick="addCal('${t.text}')">📅</button>
<button onclick="delTodo(${i})">×</button>
</div>
</div>`).join("");

localStorage.setItem("todo",JSON.stringify(todo));
}

function addTodo(){
let v=todoInput.value;
if(!v)return;
todo.push({text:v,done:false});
todoInput.value="";
renderTodo();
}

function toggleTodo(i){
todo[i].done=!todo[i].done;
renderTodo();
}

function delTodo(i){
todo.splice(i,1);
renderTodo();
}

// ===== カレンダー =====
function addCal(text){
let t=encodeURIComponent(text);
let d=new Date();
let y=d.getFullYear();
let m=String(d.getMonth()+1).padStart(2,'0');
let da=String(d.getDate()).padStart(2,'0');

let url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${t}&dates=${y}${m}${da}/${y}${m}${da}`;

window.open(url);
}

// ===== 持ち物 =====
let items = JSON.parse(localStorage.getItem("items")||"[]");

function renderItems(){
itemList.innerHTML = items.map((t,i)=>`
<div class="todo-item">
<label><input type="checkbox"> ${t}</label>
<button onclick="delItem(${i})">×</button>
</div>`).join("");

localStorage.setItem("items",JSON.stringify(items));
}

function addItem(){
let v=itemInput.value;
if(!v)return;
items.push(v);
itemInput.value="";
renderItems();
}

function delItem(i){
items.splice(i,1);
renderItems();
}

// ===== 初期表示 =====
updateClock();
renderTodo();
renderItems();
</script>

</body>
</html>
